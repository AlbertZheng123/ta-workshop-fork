name: Autonomous AI Developer

# TA-controlled: adding 'approved' spends model credit and may open a draft PR.
# Requires a runner with Docker. Nothing in this workflow merges a PR.

on:
  issues:
    types: [labeled]

jobs:
  run-agent:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check trusted starter tests
        run: python -m pytest tests -q

      - name: Build isolated QA image
        run: docker build -f Dockerfile.qa -t cs3300-workshop-qa:local .

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run agent orchestrator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKSHOP_ALLOW_PUBLISH: 'true'
          WORKSHOP_BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python main.py --mode multi --issue "${{ github.event.issue.number }}"
